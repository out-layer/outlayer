[package]
name = "caller-gate-probe"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "A WASI module whose only job is exercising the manifest's callers block: it answers who called it"

[[bin]]
name = "caller-gate-probe"
path = "src/main.rs"

[features]
# Which manifest the build embeds — exactly one. `open` is the default, so a
# plain `cargo build`, and a build of the repository on the platform (which
# passes no features), embeds it.
default = ["open"]
# No callers block: every door, meta-transactions included.
open = []
# Direct calls only.
direct-only = []
# Calls through any contract only.
contract-any = []
# Calls from relay.outlayer-alice.testnet only.
contract-relay = []
# Calls from deputy.outlayer-alice.testnet only: an account whose key the
# suite holds, so it can also stand as a relayer and sign for itself.
contract-deputy = []
# HTTPS calls only.
https-only = []
# Direct calls, meta-transactions and HTTPS; no contract.
meta-tx = []
# `tasks: true` with the direct door shut: refused before it runs.
tasks-direct-deny = []
# The same code and manifest with one constant changed: another sha256.
v2 = []

[dependencies]
serde_json = "1.0"

[profile.release]
opt-level = "z"
lto = true
strip = true
codegen-units = 1
