[package]
name = "keystore-dao-contract"
version = "0.1.0"
edition = "2021"
repository = "https://github.com/out-layer/outlayer"
license = "Apache-2.0"

[package.metadata.near.build]
wasm-opt-args = ["--enable-bulk-memory"]

# `cargo near build reproducible-wasm`: the release build, in this pinned image, from a clean
# committed tree. Anyone rebuilding the same commit gets the same wasm and the same sha256 —
# the code hash a DAO upgrade proposal names.
[package.metadata.near.reproducible_build]
image = "sourcescan/cargo-near:0.21.1-rust-1.93.0"
image_digest = "sha256:79b789c81ba19ec30794a6b1046b02dcaf5c055994b22cc7c9af67ab5096b095"
passed_env = []
container_build_command = ["cargo", "near", "build", "non-reproducible-wasm", "--locked", "--features", "abi", "--no-embed-abi"]

[lib]
crate-type = ["cdylib", "rlib"]

[features]
abi = ["borsh/unstable__schema"]

[dependencies]
near-sdk = { version = "= 5.29.0", features = ["legacy"] }
schemars = "0.8"
borsh = { version = "1.5", features = ["derive"] }

dcap-qvl = { version = "= 0.3.11", default-features = false, features = ["contract", "borsh", "std", "ring"] }
hex = "0.4"
sha2 = "0.10"
serde_json = "1.0"

[dev-dependencies]
# `unit-testing` enables near-sdk's `VMContextBuilder` and lifts the
# `cargo build` ↔ `cargo near build` guard so tests can run on the host
# toolchain rather than wasm32. Cargo activates this feature only for
# tests / examples / benches, so the production WASM stays unaffected.
near-sdk = { version = "= 5.29.0", features = ["legacy", "unit-testing"] }
near-workspaces = { version = "= 0.14.1", features = ["unstable"] }
tokio = { version = "1.40", features = ["full"] }
anyhow = "1.0"

# WASM-specific dependencies (same as register-contract)
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["custom"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true

[profile.release.package."*"]
codegen-units = 1
opt-level = "z"