[package]
name = "offchainvm-worker"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[lib]
name = "offchainvm_worker"
path = "src/lib.rs"

[[bin]]
name = "offchainvm-worker"
path = "src/main.rs"

[dependencies]
# Async runtime
tokio = { version = "1.38", features = ["full"] }
async-trait = "0.1"

# HTTP client for API
reqwest = { version = "0.11", features = ["json", "multipart", "blocking"] }

# NEAR
near-jsonrpc-client = "0.22"
near-primitives = "0.37"
near-crypto = "0.37"
near-jsonrpc-primitives = "0.37"

# Shared with the coordinator and keystore: the Agent Connect binding
# assessment (hos module) must be ONE implementation, so the worker's
# TEE-side verdict cannot drift from the coordinator's.
shared-tee-helpers = { git = "https://github.com/out-layer/shared-tee-helpers", branch = "main" }

# WASM execution (wasmtime with WASI Preview 2 support)
# wasmtime = { version = "37", features = ["component-model", "async"] }
# WASI core, CLI (for WasiCommand), and HTTP support.
# FIX: Added 'cli' feature to export `bindings` module for WasiCommand.
# wasmtime-wasi = { version = "37" } 

wasmtime = { version = "28", features = ["component-model", "async"] }
wasmtime-wasi = "28"
wasmtime-wasi-http = "28"
hyper = "1.8"
wasmparser = "0.220"

# WASM execution (wasmi for WASI Preview 1 support)
wasmi = "0.32"

# Docker client
bollard = "0.17"
futures-util = "0.3"
tar = "0.4"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
borsh = "1.5"

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Config
dotenv = "0.15"

# Crypto
sha2 = "0.10"
hex = "0.4"
bs58 = "0.5"
base64 = "0.22"
ed25519-dalek = "2.1"
zeroize = "1.8"  # signing-key seeds are wiped when dropped

# Utils
uuid = { version = "1.0", features = ["v4"] }
regex = "1.10"
rand = "0.8"
urlencoding = "2.1"
dirs = "5.0"

# Phala dstack SDK for TDX attestation
dstack-sdk = "0.1"
log = "0.4.28"
tempfile = "3.10"  # secure temp dir for native compilation (0700 perms + random name)
