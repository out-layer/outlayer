version: '3.8'

# Docker Compose configuration for NEAR OutLayer on Phala Cloud
#
# This runs the worker in Intel TDX TEE environment with:
# - Automatic TDX quote generation via /var/run/dstack.sock (provided by Phala)
# - Outbound connection to public coordinator API
# - Optional keystore service for encrypted secrets
#
# Deploy via Phala Cloud CLI:
#   phala cvms create --name near-outlayer-worker \
#     --compose ./docker-compose.phala.yml \
#     --env-file ./.env.phala \
#     --vcpu 2 --memory 4096 --disk-size 60

services:
  # Main worker service
  # Use --version flag with deploy_phala.sh to deploy verified images from GitHub Actions
  # Example: ./scripts/deploy_phala.sh worker testnet --version v0.1.1
  worker:
    image: ${DOCKER_IMAGE_WORKER}
    container_name: near-outlayer-worker
    # restart: no # Mainnet
    restart: on-failure:5  # Testnet. Will spend gas on startup retries,

    environment:
      # Coordinator API (must be publicly accessible)
      API_BASE_URL: ${API_BASE_URL}
      API_AUTH_TOKEN: ${API_AUTH_TOKEN}

      # NEAR Configuration
      NEAR_RPC_URL: ${NEAR_RPC_URL}
      OFFCHAINVM_CONTRACT_ID: ${OFFCHAINVM_CONTRACT_ID}
      OPERATOR_ACCOUNT_ID: ${OPERATOR_ACCOUNT_ID}
      # OPERATOR_PRIVATE_KEY only needed when USE_TEE_REGISTRATION=false (legacy mode)
      # In TEE mode, key is generated during registration
      OPERATOR_PRIVATE_KEY: ${OPERATOR_PRIVATE_KEY:-}

      # TEE Configuration (Phala Cloud)
      TEE_MODE: ${TEE_MODE}
      USE_TEE_REGISTRATION: ${USE_TEE_REGISTRATION}
      COMPILATION_ENABLED: ${COMPILATION_ENABLED}
      EXECUTION_ENABLED: ${EXECUTION_ENABLED}

      # Init Account (pays gas for worker registration when USE_TEE_REGISTRATION=true)
      INIT_ACCOUNT_ID: ${INIT_ACCOUNT_ID:-}
      INIT_ACCOUNT_PRIVATE_KEY: ${INIT_ACCOUNT_PRIVATE_KEY:-}

      # Keystore (optional - for encrypted secrets)
      KEYSTORE_BASE_URLS: ${KEYSTORE_BASE_URLS:-http://keystore:8081}
      KEYSTORE_AUTH_TOKEN: ${KEYSTORE_AUTH_TOKEN:-}

      # Logging
      RUST_LOG: ${RUST_LOG:-info}
      SAVE_SYSTEM_HIDDEN_LOGS_TO_DEBUG: ${SAVE_SYSTEM_HIDDEN_LOGS_TO_DEBUG:-false}
      PRINT_WASM_STDERR: ${PRINT_WASM_STDERR:-false}

      # Event Monitor (optional)
      ENABLE_EVENT_MONITOR: ${ENABLE_EVENT_MONITOR:-false}
      NEARDATA_API_URL: ${NEARDATA_API_URL:-}
      FASTNEAR_API_URL: ${FASTNEAR_API_URL:-}
      START_BLOCK_HEIGHT: ${START_BLOCK_HEIGHT:-0}

      # Polling
      POLL_TIMEOUT_SECONDS: 30

      # Execution engine: `outlayer` (this image's runtime) or `defuse-worker`
      # (the `outlayer-core` service below; the coordinator then routes only
      # DEFUSE_WORKER_PROJECTS here)
      EXECUTION_ENGINE: ${EXECUTION_ENGINE:-outlayer}
      DEFUSE_WORKER_URL: http://outlayer-core:50051

    # Worker needs access to dstack socket for TDX quotes
    # Phala provides this automatically at /var/run/dstack.sock
    volumes:
      - /var/run/dstack.sock:/var/run/dstack.sock:ro

    # Health check
    healthcheck:
      test: ["CMD", "ps", "aux", "|", "grep", "-v", "grep", "|", "grep", "worker"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # The Defuse Outlayer worker, unmodified, as the execution engine
  # (EXECUTION_ENGINE=defuse-worker; start with `--profile defuse-worker`).
  # Reachable only on the compose network: no ports, no auth. Its seed is the
  # test-mode one and signs nothing of value — the worker refuses components that
  # import `outlayer:crypto`. The attestation measures the compose TEXT, not env
  # values: write the image digest literally here for an engine deployment.
  outlayer-core:
    profiles: ["defuse-worker"]
    image: ${DOCKER_IMAGE_OUTLAYER_CORE}
    container_name: outlayer-core
    restart: on-failure:5
    environment:
      # Their executor logs the first 4 KiB of a failed guest's stdin at WARN, and
      # on this engine stdin is the envelope: the run's secrets and call token.
      # The executor crate is held to ERROR whatever the operator's filter says.
      OUTLAYER__LOG: ${OUTLAYER_CORE_LOG:-info},defuse_outlayer_executor=error
      OUTLAYER__SEED: ${OUTLAYER_CORE_SEED}
      OUTLAYER__SERVICE__ALLOW_UNDEPLOYED_CODE: "true"
      OUTLAYER__TELEMETRY__ENABLED: "false"
      OUTLAYER__GRPC_SERVER__CONCURRENCY_LIMIT_PER_CONNECTION: "500"
      OUTLAYER__GRPC__MAX_PENDING_REQUESTS: "500"
      # Inline wasm travels in the request: well above the stdin limit below
      OUTLAYER__GRPC__MAX_REQUEST_BYTES: "67108864"
      # The fleet's time ceiling; each job's own deadline is set per call
      OUTLAYER__GRPC__REQUEST_HANDLING_TIMEOUT_SECONDS: ${MAX_EXECUTION_SECONDS_CAP:-300}
      # The fleet's memory tier. Concurrency = budget / per-execution cost.
      OUTLAYER__SERVICE__EXECUTOR__WASM_MEMORY_LIMIT_BYTES: ${OUTLAYER_CORE_WASM_MEMORY_BYTES:-268435456}
      OUTLAYER__SERVICE__MAX_WASM_MEMORY_BYTES: ${OUTLAYER_CORE_MEMORY_BUDGET_BYTES:-2147483648}
      OUTLAYER__SERVICE__EXECUTOR__IO_LIMITS__STDIN_BYTES: "10485760"
      OUTLAYER__SERVICE__EXECUTOR__IO_LIMITS__STDOUT_BYTES: "10485760"
      # The guest's stderr comes back in a failure message, as on the OutLayer engine
      OUTLAYER__SERVICE__EXECUTOR__IO_LIMITS__STDERR_BYTES: "1048576"
      # Storage from the guest is HTTPS: every record costs egress bytes
      OUTLAYER__SERVICE__EXECUTOR__HTTP__MAX_TOTAL_BYTES: "67108864"
    expose:
      - "50051"
    mem_limit: ${OUTLAYER_CORE_MEM_LIMIT:-3g}

  # Optional: Keystore service for encrypted secrets
  # Uncomment if you need secret decryption support
  # keystore:
  #   image: ${DOCKER_IMAGE_KEYSTORE}
  #   container_name: near-outlayer-keystore
  #   restart: unless-stopped
  #
  #   environment:
  #     PORT: 8081
  #     NEAR_RPC_URL: ${NEAR_RPC_URL}
  #     OFFCHAINVM_CONTRACT_ID: ${OFFCHAINVM_CONTRACT_ID}
  #     TEE_MODE: tdx
  #     RUST_LOG: ${RUST_LOG:-info}
  #
  #   # Internal port only (accessed by worker via Docker network)
  #   expose:
  #     - "8081"
  #
  #   # Keystore also needs dstack socket for attestation
  #   volumes:
  #     - /var/run/dstack.sock:/var/run/dstack.sock:ro
  #
  #   healthcheck:
  #     test: ["CMD", "curl", "-f", "http://localhost:8081/health"]
  #     interval: 30s
  #     timeout: 10s
  #     retries: 3
  #     start_period: 10s

# Network configuration
# Phala Cloud provides Docker bridge network automatically
networks:
  default:
    name: near-outlayer-network
