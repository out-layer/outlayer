<svg xmlns='http://www.w3.org/2000/svg' width='1200' height='660' viewBox='0 0 1200 660'>
<defs><marker id='ae' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='8' markerHeight='8' orient='auto'><path d='M0,0 L10,5 L0,10 z' fill='#374151'/></marker><marker id='as' viewBox='0 0 10 10' refX='1' refY='5' markerWidth='8' markerHeight='8' orient='auto'><path d='M10,0 L0,5 L10,10 z' fill='#374151'/></marker><marker id='ao' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='8' markerHeight='8' orient='auto'><path d='M0,0 L10,5 L0,10 z' fill='#7c3aed'/></marker><marker id='ad' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='8' markerHeight='8' orient='auto'><path d='M0,0 L10,5 L0,10 z' fill='#2563eb'/></marker><marker id='ag' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='8' markerHeight='8' orient='auto'><path d='M0,0 L10,5 L0,10 z' fill='#16a34a'/></marker></defs>
<rect x='0' y='0' width='1200' height='660' fill='#ffffff'/>
<rect x='390' y='20' width='420' height='70' rx='6' fill='#ede9fe' stroke='#7c3aed' stroke-width='1.5'/>
<text x='600.0' y='50.0' text-anchor='middle' font-family='Helvetica, Arial, sans-serif' font-size='15' font-weight='bold' fill='#111'>Owner: a NEAR account</text>
<text x='600.0' y='70.0' text-anchor='middle' font-family='Helvetica, Arial, sans-serif' font-size='14' font-weight='normal' fill='#111'>sets the policy, approves, can leave with both keys</text>
<rect x='40' y='125' width='520' height='350' rx='8' fill='#eff6ff' stroke='#2563eb' stroke-width='2'/>
<text x='58' y='150' text-anchor='start' font-family='Helvetica, Arial, sans-serif' font-size='15' font-weight='bold' fill='#111'>The agent: its key and its wallet contract</text>
<rect x='640' y='125' width='520' height='350' rx='8' fill='#f0fdf4' stroke='#16a34a' stroke-width='2'/>
<text x='1142' y='150' text-anchor='end' font-family='Helvetica, Arial, sans-serif' font-size='15' font-weight='bold' fill='#111'>OutLayer: an Intel TDX enclave</text>
<rect x='90' y='165' width='420' height='110' rx='6' fill='#dbeafe' stroke='#2563eb' stroke-width='1.5'/>
<text x='300.0' y='205.0' text-anchor='middle' font-family='Helvetica, Arial, sans-serif' font-size='15' font-weight='bold' fill='#111'>Agent</text>
<text x='300.0' y='225.0' text-anchor='middle' font-family='Helvetica, Arial, sans-serif' font-size='14' font-weight='normal' fill='#111'>key A, made from one signature of the owner</text>
<text x='300.0' y='245.0' text-anchor='middle' font-family='Helvetica, Arial, sans-serif' font-size='14' font-weight='normal' fill='#111'>checks the request and signs last</text>
<rect x='90' y='355' width='420' height='100' rx='6' fill='#fef3c7' stroke='#d97706' stroke-width='1.5'/>
<text x='300.0' y='380.0' text-anchor='middle' font-family='Helvetica, Arial, sans-serif' font-size='15' font-weight='bold' fill='#111'>Wallet contract on NEAR</text>
<text x='300.0' y='400.0' text-anchor='middle' font-family='Helvetica, Arial, sans-serif' font-size='14' font-weight='normal' fill='#111'>the NEAR Intents wallet contract, holds the funds</text>
<text x='300.0' y='420.0' text-anchor='middle' font-family='Helvetica, Arial, sans-serif' font-size='14' font-weight='normal' fill='#111'>a keyless 0s… account (NEP-616) by default</text>
<text x='300.0' y='440.0' text-anchor='middle' font-family='Helvetica, Arial, sans-serif' font-size='14' font-weight='normal' fill='#111'>key = A ‖ E: executes only with both signatures</text>
<rect x='690' y='165' width='420' height='74' rx='6' fill='#dcfce7' stroke='#16a34a' stroke-width='1.5'/>
<text x='900.0' y='187.0' text-anchor='middle' font-family='Helvetica, Arial, sans-serif' font-size='15' font-weight='bold' fill='#111'>The owner&#x27;s policy</text>
<text x='900.0' y='207.0' text-anchor='middle' font-family='Helvetica, Arial, sans-serif' font-size='14' font-weight='normal' fill='#111'>limits, allowlists, approvals by M of N,</text>
<text x='900.0' y='227.0' text-anchor='middle' font-family='Helvetica, Arial, sans-serif' font-size='14' font-weight='normal' fill='#111'>freeze, lock</text>
<rect x='690' y='250' width='420' height='70' rx='6' fill='#dcfce7' stroke='#16a34a' stroke-width='1.5'/>
<text x='900.0' y='280.0' text-anchor='middle' font-family='Helvetica, Arial, sans-serif' font-size='15' font-weight='bold' fill='#111'>The second signature: key E</text>
<text x='900.0' y='300.0' text-anchor='middle' font-family='Helvetica, Arial, sans-serif' font-size='14' font-weight='normal' fill='#111'>made only for an operation the policy allows</text>
<rect x='690' y='355' width='205' height='100' rx='6' fill='#dcfce7' stroke='#16a34a' stroke-width='1.5'/>
<text x='792.5' y='380.0' text-anchor='middle' font-family='Helvetica, Arial, sans-serif' font-size='15' font-weight='bold' fill='#111'>Working account</text>
<text x='792.5' y='400.0' text-anchor='middle' font-family='Helvetica, Arial, sans-serif' font-size='14' font-weight='normal' fill='#111'>TEE custody:</text>
<text x='792.5' y='420.0' text-anchor='middle' font-family='Helvetica, Arial, sans-serif' font-size='14' font-weight='normal' fill='#111'>other chains, venues,</text>
<text x='792.5' y='440.0' text-anchor='middle' font-family='Helvetica, Arial, sans-serif' font-size='14' font-weight='normal' fill='#111'>relays, pays gas</text>
<rect x='905' y='355' width='205' height='100' rx='6' fill='#dcfce7' stroke='#16a34a' stroke-width='1.5'/>
<text x='1007.5' y='380.0' text-anchor='middle' font-family='Helvetica, Arial, sans-serif' font-size='15' font-weight='bold' fill='#111'>Connectors, secrets</text>
<text x='1007.5' y='400.0' text-anchor='middle' font-family='Helvetica, Arial, sans-serif' font-size='14' font-weight='normal' fill='#111'>web2: banks, mail,</text>
<text x='1007.5' y='420.0' text-anchor='middle' font-family='Helvetica, Arial, sans-serif' font-size='14' font-weight='normal' fill='#111'>exchanges; their keys</text>
<text x='1007.5' y='440.0' text-anchor='middle' font-family='Helvetica, Arial, sans-serif' font-size='14' font-weight='normal' fill='#111'>stay in the enclave</text>
<path d='M 450,90 L 450,165' fill='none' stroke='#7c3aed' stroke-width='1.8' marker-end='url(#ao)'/>
<rect x='399.32' y='97.0' width='101.36000000000001' height='22' rx='3' fill='#ffffff' stroke='#7c3aed'/>
<text x='450' y='112.0' text-anchor='middle' font-family='Helvetica, Arial, sans-serif' font-size='12' font-weight='normal' fill='#374151'>one signature</text>
<path d='M 750,90 L 750,165' fill='none' stroke='#7c3aed' stroke-width='1.8' marker-end='url(#ao)'/>
<rect x='659.0' y='97.0' width='182.00000000000003' height='22' rx='3' fill='#ffffff' stroke='#7c3aed'/>
<text x='750' y='112.0' text-anchor='middle' font-family='Helvetica, Arial, sans-serif' font-size='12' font-weight='normal' fill='#374151'>policy, approvals, freeze</text>
<path d='M 510,195 L 690,195' fill='none' stroke='#374151' stroke-width='1.8' marker-end='url(#ae)'/>
<rect x='562.76' y='169.0' width='74.48' height='22' rx='3' fill='#ffffff' stroke='#e5e7eb'/>
<text x='600' y='184.0' text-anchor='middle' font-family='Helvetica, Arial, sans-serif' font-size='12' font-weight='normal' fill='#374151'>operation</text>
<path d='M 690,265 L 510,265' fill='none' stroke='#374151' stroke-width='1.8' marker-end='url(#ae)'/>
<rect x='539.24' y='239.0' width='121.52000000000001' height='22' rx='3' fill='#ffffff' stroke='#e5e7eb'/>
<text x='600' y='254.0' text-anchor='middle' font-family='Helvetica, Arial, sans-serif' font-size='12' font-weight='normal' fill='#374151'>request to check</text>
<path d='M 220,275 L 220,355' fill='none' stroke='#2563eb' stroke-width='2.6' marker-end='url(#ad)'/>
<rect x='162.04' y='304.5' width='115.92000000000002' height='23' rx='3' fill='#ffffff' stroke='#2563eb'/>
<text x='220' y='320.5' text-anchor='middle' font-family='Helvetica, Arial, sans-serif' font-size='13' font-weight='normal' fill='#374151'>signature of A</text>
<path d='M 800,320 L 800,338 L 380,338 L 380,355' fill='none' stroke='#16a34a' stroke-width='2.6' marker-end='url(#ag)'/>
<rect x='542.04' y='326.5' width='115.92000000000002' height='23' rx='3' fill='#ffffff' stroke='#16a34a'/>
<text x='600' y='342.5' text-anchor='middle' font-family='Helvetica, Arial, sans-serif' font-size='13' font-weight='normal' fill='#374151'>signature of E</text>
<path d='M 690,420 L 510,420' fill='none' stroke='#374151' stroke-width='1.8' marker-end='url(#ae)'/>
<rect x='539.24' y='409.0' width='121.52000000000001' height='22' rx='3' fill='#ffffff' stroke='#e5e7eb'/>
<text x='600' y='424.0' text-anchor='middle' font-family='Helvetica, Arial, sans-serif' font-size='12' font-weight='normal' fill='#374151'>w_execute_signed</text>
<rect x='40' y='510' width='1120' height='130' rx='8' fill='#fffbeb' stroke='#fcd34d' stroke-width='2'/>
<text x='600.0' y='535' text-anchor='middle' font-family='Helvetica, Arial, sans-serif' font-size='15' font-weight='bold' fill='#111'>NEAR</text>
<rect x='90' y='548' width='420' height='74' rx='6' fill='#fef3c7' stroke='#d97706' stroke-width='1.5'/>
<text x='300.0' y='580.0' text-anchor='middle' font-family='Helvetica, Arial, sans-serif' font-size='15' font-weight='bold' fill='#111'>intents.near and the 1Click API</text>
<text x='300.0' y='600.0' text-anchor='middle' font-family='Helvetica, Arial, sans-serif' font-size='14' font-weight='normal' fill='#111'>the balance, swaps, withdrawals to other chains</text>
<rect x='690' y='548' width='200' height='74' rx='6' fill='#fef3c7' stroke='#d97706' stroke-width='1.5'/>
<text x='790.0' y='570.0' text-anchor='middle' font-family='Helvetica, Arial, sans-serif' font-size='15' font-weight='bold' fill='#111'>NEAR MPC</text>
<text x='790.0' y='590.0' text-anchor='middle' font-family='Helvetica, Arial, sans-serif' font-size='14' font-weight='normal' fill='#111'>reaches key E</text>
<text x='790.0' y='610.0' text-anchor='middle' font-family='Helvetica, Arial, sans-serif' font-size='14' font-weight='normal' fill='#111'>and never key A</text>
<rect x='910' y='548' width='200' height='74' rx='6' fill='#fef3c7' stroke='#d97706' stroke-width='1.5'/>
<text x='1010.0' y='570.0' text-anchor='middle' font-family='Helvetica, Arial, sans-serif' font-size='15' font-weight='bold' fill='#111'>OutLayer DAO</text>
<text x='1010.0' y='590.0' text-anchor='middle' font-family='Helvetica, Arial, sans-serif' font-size='14' font-weight='normal' fill='#111'>approves builds by hash,</text>
<text x='1010.0' y='610.0' text-anchor='middle' font-family='Helvetica, Arial, sans-serif' font-size='14' font-weight='normal' fill='#111'>holds the exit&#x27;s escrow</text>
<path d='M 300,455 L 300,548' fill='none' stroke='#374151' stroke-width='1.8' marker-end='url(#ae)'/>
<rect x='256.04' y='481.0' width='87.92' height='22' rx='3' fill='#ffffff' stroke='#e5e7eb'/>
<text x='300' y='496.0' text-anchor='middle' font-family='Helvetica, Arial, sans-serif' font-size='12' font-weight='normal' fill='#374151'>one promise</text>
<path d='M 810,40 L 1185,40 L 1185,585 L 1110,585' fill='none' stroke='#7c3aed' stroke-width='1.8' marker-end='url(#ao)'/>
<rect x='861.88' y='29.0' width='296.24' height='22' rx='3' fill='#ffffff' stroke='#7c3aed'/>
<text x='1010' y='44.0' text-anchor='middle' font-family='Helvetica, Arial, sans-serif' font-size='12' font-weight='normal' fill='#374151'>owner exit: both keys, no OutLayer service</text>
