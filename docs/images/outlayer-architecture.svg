<text x='945' y='231.3' text-anchor='middle' font-family='Helvetica, Arial, sans-serif' font-size='11' fill='#374151'>decrypted secrets, program keys,</text>
<text x='945' y='246.3' text-anchor='middle' font-family='Helvetica, Arial, sans-serif' font-size='11' fill='#374151'>VRF output; wallet keys never</text>
<path d='M 1065,120 L 1180,120' fill='none' stroke='#374151' stroke-width='1.5' marker-end='url(#ae)'/>
