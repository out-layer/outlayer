<svg xmlns='http://www.w3.org/2000/svg' width='1500' height='690' viewBox='0 0 1500 690'>
<defs><marker id='ae' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='8' markerHeight='8' orient='auto'><path d='M0,0 L10,5 L0,10 z' fill='#374151'/></marker><marker id='as' viewBox='0 0 10 10' refX='1' refY='5' markerWidth='8' markerHeight='8' orient='auto'><path d='M10,0 L0,5 L10,10 z' fill='#374151'/></marker></defs>
<rect x='0' y='0' width='1500' height='690' fill='#ffffff'/>
<rect x='500' y='30' width='600' height='378' rx='8' fill='#f0fdf4' stroke='#16a34a' stroke-width='2'/>
<text x='800.0' y='50' text-anchor='middle' font-family='Helvetica, Arial, sans-serif' font-size='13' fill='#111' font-weight='bold'>Intel TDX enclaves: every build attested on chain and approved by the DAO</text>
<rect x='60' y='505' width='1040' height='160' rx='8' fill='#fffbeb' stroke='#fcd34d' stroke-width='1.5'/>
<text x='580.0' y='525' text-anchor='middle' font-family='Helvetica, Arial, sans-serif' font-size='13' fill='#111' font-weight='bold'>NEAR: the state</text>
<rect x='60' y='30' width='215' height='76' rx='6' fill='#ede9fe' stroke='#7c3aed' stroke-width='1.5'/>
<text x='167.5' y='54.5' text-anchor='middle' font-family='Helvetica, Arial, sans-serif' font-size='13' fill='#111' font-weight='bold'>Owner: a NEAR account</text>
<text x='167.5' y='72.5' text-anchor='middle' font-family='Helvetica, Arial, sans-serif' font-size='13' fill='#111'>sets the rules, lends secrets,</text>
<text x='167.5' y='90.5' text-anchor='middle' font-family='Helvetica, Arial, sans-serif' font-size='13' fill='#111'>approves, can leave</text>
<rect x='60' y='126' width='215' height='60' rx='6' fill='#dbeafe' stroke='#2563eb' stroke-width='1.5'/>
<text x='167.5' y='151.6' text-anchor='middle' font-family='Helvetica, Arial, sans-serif' font-size='13' fill='#111' font-weight='bold'>Agent or backend</text>
<text x='167.5' y='169.6' text-anchor='middle' font-family='Helvetica, Arial, sans-serif' font-size='13' fill='#111'>HTTPS: API key, payment key</text>
<rect x='60' y='206' width='215' height='60' rx='6' fill='#dbeafe' stroke='#2563eb' stroke-width='1.5'/>
<text x='167.5' y='231.6' text-anchor='middle' font-family='Helvetica, Arial, sans-serif' font-size='13' fill='#111' font-weight='bold'>NEAR contract</text>
<text x='167.5' y='249.6' text-anchor='middle' font-family='Helvetica, Arial, sans-serif' font-size='13' fill='#111'>request_execution, yield / resume</text>
<rect x='60' y='330' width='370' height='100' rx='6' fill='#f3f4f6' stroke='#6b7280' stroke-width='1.5'/>
<text x='245.0' y='365.9' text-anchor='middle' font-family='Helvetica, Arial, sans-serif' font-size='14' fill='#111' font-weight='bold'>Coordinator</text>
<text x='245.0' y='384.9' text-anchor='middle' font-family='Helvetica, Arial, sans-serif' font-size='14' fill='#111'>API, auth, queue, metering</text>
<text x='245.0' y='403.9' text-anchor='middle' font-family='Helvetica, Arial, sans-serif' font-size='14' fill='#111'>holds no wallet keys</text>
<rect x='549' y='84' width='530' height='100' rx='6' fill='#dcfce7' stroke='#16a34a' stroke-width='1.2'/>
<rect x='542' y='77' width='530' height='100' rx='6' fill='#dcfce7' stroke='#16a34a' stroke-width='1.2'/>
<rect x='535' y='70' width='530' height='100' rx='6' fill='#dcfce7' stroke='#16a34a' stroke-width='1.5'/>
<text x='800.0' y='96.4' text-anchor='middle' font-family='Helvetica, Arial, sans-serif' font-size='14' fill='#111' font-weight='bold'>Workers: a fleet of enclaves</text>
<text x='800.0' y='115.4' text-anchor='middle' font-family='Helvetica, Arial, sans-serif' font-size='14' fill='#111'>run WASI programs, each run isolated</text>
<text x='800.0' y='134.4' text-anchor='middle' font-family='Helvetica, Arial, sans-serif' font-size='14' fill='#111'>permissionless: anyone publishes a program, anyone calls it</text>
<text x='800.0' y='153.4' text-anchor='middle' font-family='Helvetica, Arial, sans-serif' font-size='14' fill='#111'>yours, a partner&#x27;s, connectors</text>
<rect x='634' y='314' width='360' height='80' rx='6' fill='#dcfce7' stroke='#16a34a' stroke-width='1.2'/>
<rect x='627' y='307' width='360' height='80' rx='6' fill='#dcfce7' stroke='#16a34a' stroke-width='1.2'/>
<rect x='620' y='300' width='360' height='80' rx='6' fill='#dcfce7' stroke='#16a34a' stroke-width='1.5'/>
<text x='800.0' y='325.9' text-anchor='middle' font-family='Helvetica, Arial, sans-serif' font-size='14' fill='#111' font-weight='bold'>Keystores: several instances, the same keys</text>
<text x='800.0' y='344.9' text-anchor='middle' font-family='Helvetica, Arial, sans-serif' font-size='14' fill='#111'>derive keys, check the policy,</text>
<text x='800.0' y='363.9' text-anchor='middle' font-family='Helvetica, Arial, sans-serif' font-size='14' fill='#111'>sign, decrypt secrets</text>
<rect x='1180' y='85' width='290' height='70' rx='6' fill='#f3f4f6' stroke='#6b7280' stroke-width='1.5'/>
<text x='1325.0' y='115.5' text-anchor='middle' font-family='Helvetica, Arial, sans-serif' font-size='13' fill='#111' font-weight='bold'>The internet: any HTTPS API</text>
<text x='1325.0' y='133.6' text-anchor='middle' font-family='Helvetica, Arial, sans-serif' font-size='13' fill='#111'>NEAR AI, banks, exchanges, mail</text>
<rect x='1180' y='270' width='290' height='58' rx='6' fill='#f3f4f6' stroke='#6b7280' stroke-width='1.5'/>
<text x='1325.0' y='294.6' text-anchor='middle' font-family='Helvetica, Arial, sans-serif' font-size='13' fill='#111' font-weight='bold'>NEAR, EVM, Solana</text>
<text x='1325.0' y='312.6' text-anchor='middle' font-family='Helvetica, Arial, sans-serif' font-size='13' fill='#111'>signed directly</text>
<rect x='1180' y='345' width='290' height='74' rx='6' fill='#f3f4f6' stroke='#6b7280' stroke-width='1.5'/>
<text x='1325.0' y='368.6' text-anchor='middle' font-family='Helvetica, Arial, sans-serif' font-size='13' fill='#111' font-weight='bold'>NEAR Intents (intents.near)</text>
<text x='1325.0' y='386.6' text-anchor='middle' font-family='Helvetica, Arial, sans-serif' font-size='13' fill='#111'>swaps, Bitcoin, TON</text>
<text x='1325.0' y='404.6' text-anchor='middle' font-family='Helvetica, Arial, sans-serif' font-size='13' fill='#111'>and every other chain</text>
<rect x='1180' y='530' width='290' height='110' rx='6' fill='#fef3c7' stroke='#d97706' stroke-width='1.5'/>
<text x='1325.0' y='562.5' text-anchor='middle' font-family='Helvetica, Arial, sans-serif' font-size='13' fill='#111' font-weight='bold'>NEAR MPC network</text>
<text x='1325.0' y='580.5' text-anchor='middle' font-family='Helvetica, Arial, sans-serif' font-size='13' fill='#111'>CKD: confidential key derivation.</text>
<text x='1325.0' y='598.5' text-anchor='middle' font-family='Helvetica, Arial, sans-serif' font-size='13' fill='#111'>Derives the master secret, returns it</text>
<text x='1325.0' y='616.5' text-anchor='middle' font-family='Helvetica, Arial, sans-serif' font-size='13' fill='#111'>encrypted to the enclave that asked</text>
<rect x='90' y='548' width='290' height='95' rx='6' fill='#fef3c7' stroke='#d97706' stroke-width='1.5'/>
<text x='235.0' y='582.0' text-anchor='middle' font-family='Helvetica, Arial, sans-serif' font-size='13' fill='#111' font-weight='bold'>outlayer.near</text>
<text x='235.0' y='600.0' text-anchor='middle' font-family='Helvetica, Arial, sans-serif' font-size='13' fill='#111'>encrypted policies and secrets,</text>
<text x='235.0' y='618.0' text-anchor='middle' font-family='Helvetica, Arial, sans-serif' font-size='13' fill='#111'>projects, payment keys, prices</text>
<rect x='410' y='548' width='300' height='95' rx='6' fill='#fef3c7' stroke='#d97706' stroke-width='1.5'/>
<text x='560.0' y='582.0' text-anchor='middle' font-family='Helvetica, Arial, sans-serif' font-size='13' fill='#111' font-weight='bold'>your vault contract</text>
<text x='560.0' y='600.0' text-anchor='middle' font-family='Helvetica, Arial, sans-serif' font-size='13' fill='#111'>optional: gates a master secret</text>
<text x='560.0' y='618.0' text-anchor='middle' font-family='Helvetica, Arial, sans-serif' font-size='13' fill='#111'>of your own</text>
<rect x='740' y='548' width='330' height='95' rx='6' fill='#fef3c7' stroke='#d97706' stroke-width='1.5'/>
<text x='905.0' y='582.0' text-anchor='middle' font-family='Helvetica, Arial, sans-serif' font-size='13' fill='#111' font-weight='bold'>dao.outlayer.near: the keystore DAO</text>
<text x='905.0' y='600.0' text-anchor='middle' font-family='Helvetica, Arial, sans-serif' font-size='13' fill='#111'>approves enclave builds and contract</text>
<text x='905.0' y='618.0' text-anchor='middle' font-family='Helvetica, Arial, sans-serif' font-size='13' fill='#111'>upgrades, gates the default master secret</text>
