<text x='497' y='436.2' text-anchor='middle' font-family='Helvetica, Arial, sans-serif' font-size='12' fill='#374151'>wallet operation</text>
<path d='M 770,170 L 770,300' fill='none' stroke='#374151' stroke-width='1.5' marker-end='url(#ae)'/>
<rect x='608.5' y='218.0' width='127.0' height='34' rx='3' fill='#ffffff' stroke='#e5e7eb'/>
<text x='672' y='231.3' text-anchor='middle' font-family='Helvetica, Arial, sans-serif' font-size='11' fill='#374151'>host functions ask:</text>
<text x='672' y='246.3' text-anchor='middle' font-family='Helvetica, Arial, sans-serif' font-size='11' fill='#374151'>secrets, keys, VRF</text>
<path d='M 840,300 L 840,185' fill='none' stroke='#374151' stroke-width='1.5' marker-end='url(#ae)'/>
