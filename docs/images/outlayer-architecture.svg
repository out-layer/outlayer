<path d='M 650,380 L 650,484 L 330,484 L 330,548' fill='none' stroke='#374151' stroke-width='1.5' marker-end='url(#ae)'/>
<rect x='312.5' y='474.5' width='355.0' height='19' rx='3' fill='#ffffff' stroke='#e5e7eb'/>
<text x='490' y='487.9' text-anchor='middle' font-family='Helvetica, Arial, sans-serif' font-size='11' fill='#374151'>reads the policy before every signature, and the secrets</text>
<path d='M 700,380 L 700,548' fill='none' stroke='#374151' stroke-width='1.5' marker-end='url(#ae)'/>
<rect x='674.6' y='423.0' width='120.9' height='34' rx='3' fill='#ffffff' stroke='#e5e7eb'/>
<text x='735' y='436.4' text-anchor='middle' font-family='Helvetica, Arial, sans-serif' font-size='11' fill='#374151'>asks for a vault&#x27;s</text>
<text x='735' y='451.4' text-anchor='middle' font-family='Helvetica, Arial, sans-serif' font-size='11' fill='#374151'>own master</text>
<path d='M 900,380 L 900,548' fill='none' stroke='#374151' stroke-width='1.5' marker-end='url(#ae)'/>
<rect x='847.6' y='423.0' width='194.8' height='34' rx='3' fill='#ffffff' stroke='#e5e7eb'/>
<text x='945' y='436.4' text-anchor='middle' font-family='Helvetica, Arial, sans-serif' font-size='11' fill='#374151'>asks for the master secret:</text>
<text x='945' y='451.4' text-anchor='middle' font-family='Helvetica, Arial, sans-serif' font-size='11' fill='#374151'>attested, approved builds only</text>
