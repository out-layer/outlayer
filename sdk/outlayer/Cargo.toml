[package]
name = "outlayer"
version = "0.2.1"
edition = "2021"
description = "SDK for OutLayer off-chain WASM execution on NEAR"
license = "MIT OR Apache-2.0"
repository = "https://github.com/out-layer/outlayer"
keywords = ["near", "wasm", "wasi", "storage", "blockchain"]
categories = ["wasm", "api-bindings"]

[dependencies]
wit-bindgen = "0.36"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# `defuse-engine`: storage over HTTPS from the guest, and the hashing and base64
# the services' bodies use.
waki = { version = "0.5", features = ["json"], optional = true }
sha2 = { version = "0.10", optional = true }
base64 = { version = "0.22", optional = true }
hex = { version = "0.4", optional = true }

[features]
default = []
# `outlayer:signing-keys`: the `signing_keys` module.
signing-keys = []
# `outlayer:encryption-keys`: the `encryption_keys` module and `storage::sealed`.
encryption-keys = []
# `outlayer:tasks`: the `tasks` module.
tasks = []
# The Defuse worker as the engine: no host functions, `meta` on stdin, storage over
# HTTPS with the run's call token. `env` and `storage` keep their API; `vrf`,
# `signing-keys`, `encryption-keys` and `tasks` are not available.
defuse-engine = ["dep:waki", "dep:sha2", "dep:base64", "dep:hex"]

[package.metadata.docs.rs]
all-features = true
