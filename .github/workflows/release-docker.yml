name: Release Docker Images

on:
  push:
    tags:
      - 'v*'

# One run per ref, ever. GitHub occasionally delivers a tag push twice; two
# builds then race for the same image tags and attest two different digests,
# and the release body names only one of them.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  attestations: write
  id-token: write
  contents: write
  packages: write

jobs:
  build-worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v4

      # The worker's `defuse-outlayer-proto` dependency is read from the private
      # mirror of the Defuse Outlayer repository over SSH (read-only deploy key).
      - uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.UPSTREAM_DEPLOY_KEY }}

      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile.worker-phala
          ssh: default
          push: true
          tags: |
            ${{ vars.DOCKERHUB_USERNAME }}/near-outlayer-worker:${{ github.ref_name }}
            ${{ !contains(github.ref_name, '-') && format('{0}/near-outlayer-worker:latest', vars.DOCKERHUB_USERNAME) || '' }}
          platforms: linux/amd64

      - uses: actions/attest-build-provenance@v4
        with:
          subject-name: "docker.io/${{ vars.DOCKERHUB_USERNAME }}/near-outlayer-worker"
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
        env:
          DOCKER_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKERHUB_TOKEN }}

    outputs:
      digest: ${{ steps.build.outputs.digest }}

  build-keystore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v4

      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile.keystore-phala
          push: true
          tags: |
            ${{ vars.DOCKERHUB_USERNAME }}/near-outlayer-keystore:${{ github.ref_name }}
            ${{ !contains(github.ref_name, '-') && format('{0}/near-outlayer-keystore:latest', vars.DOCKERHUB_USERNAME) || '' }}
          platforms: linux/amd64

      - uses: actions/attest-build-provenance@v4
        with:
          subject-name: "docker.io/${{ vars.DOCKERHUB_USERNAME }}/near-outlayer-keystore"
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
        env:
          DOCKER_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKERHUB_TOKEN }}

    outputs:
      digest: ${{ steps.build.outputs.digest }}

  # The Defuse Outlayer worker at the pinned tag, from the private mirror: the
  # `outlayer-core` service beside our worker.
  build-outlayer-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v4

      - uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.UPSTREAM_DEPLOY_KEY }}

      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile.outlayer-core
          ssh: default
          push: true
          tags: |
            ${{ vars.DOCKERHUB_USERNAME }}/near-outlayer-core:${{ github.ref_name }}
            ${{ !contains(github.ref_name, '-') && format('{0}/near-outlayer-core:latest', vars.DOCKERHUB_USERNAME) || '' }}
          platforms: linux/amd64

      - uses: actions/attest-build-provenance@v4
        with:
          subject-name: "docker.io/${{ vars.DOCKERHUB_USERNAME }}/near-outlayer-core"
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
        env:
          DOCKER_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKERHUB_TOKEN }}

    outputs:
      digest: ${{ steps.build.outputs.digest }}

  release:
    needs: [build-worker, build-keystore, build-outlayer-core]
    runs-on: ubuntu-latest
    steps:
      # A tag with a suffix (v0.1.94-defuse.1) is a pre-release: it moves no `latest`
      # image above and is not offered as the current release.
      - uses: softprops/action-gh-release@v3
        with:
          prerelease: ${{ contains(github.ref_name, '-') }}
          body: |
            ## Docker Images with Sigstore Attestation

            | Image | Digest | Verify |
            |-------|--------|--------|
            | worker | `${{ needs.build-worker.outputs.digest }}` | [Sigstore](https://search.sigstore.dev/?hash=${{ needs.build-worker.outputs.digest }}) |
            | keystore | `${{ needs.build-keystore.outputs.digest }}` | [Sigstore](https://search.sigstore.dev/?hash=${{ needs.build-keystore.outputs.digest }}) |
            | outlayer-core (Defuse worker, worker/v0.8.1) | `${{ needs.build-outlayer-core.outputs.digest }}` | [Sigstore](https://search.sigstore.dev/?hash=${{ needs.build-outlayer-core.outputs.digest }}) |

            ### Verification
            ```bash
            gh attestation verify oci://docker.io/${{ vars.DOCKERHUB_USERNAME }}/near-outlayer-worker@${{ needs.build-worker.outputs.digest }} -R ${{ github.repository }}
            ```

            ### Usage in docker-compose
            ```yaml
            image: docker.io/${{ vars.DOCKERHUB_USERNAME }}/near-outlayer-worker@${{ needs.build-worker.outputs.digest }}
            ```
