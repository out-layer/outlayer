[package]
name = "keystore-worker"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[dependencies]
# Async runtime
tokio = { version = "1.42", features = ["full"] }

# Web framework
axum = { version = "0.7", features = ["macros"] }
mime = "0.3"  # the JSON extractor's content-type test, applied before `/decrypt` picks its shape
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "cors"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
borsh = "1.5"  # For NEP-413 payload serialization

# Cryptography
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
k256 = { version = "0.13", features = ["ecdsa", "arithmetic"] }
rand = "0.8"
sha2 = "0.10"
sha3 = "0.10"
hmac = "0.12"
zeroize = "1.8"  # project-key seeds are wiped when dropped
hex = "0.4"
constant_time_eq = "0.3"  # constant-time bearer-token-hash comparison (timing side-channel hardening)
bs58 = "0.5"
base64 = "0.22"
regex = "1.10"
chacha20poly1305 = "0.10"  # AEAD encryption for secrets
x25519-dalek = { version = "2", features = ["static_secrets"] }  # ECIES encryption

# BLS12-381 for MPC CKD integration
blstrs = "0.7"
elliptic-curve = "0.13"
hkdf = "0.12"
rand_core = { version = "0.6", features = ["getrandom"] }

# NEAR integration
near-jsonrpc-client = "0.22"
# Same reqwest major the RPC client is built on (our own HTTP code is still on 0.11), so we can
# hand it a client that HAS a timeout — `JsonRpcClient::connect` builds one without any.
# native-tls to match near-jsonrpc-client's default feature; no second TLS stack is pulled in.
reqwest-rpc = { package = "reqwest", version = "0.12", default-features = false, features = ["json", "native-tls"] }
near-primitives = "0.37"
near-crypto = "0.37"
near-jsonrpc-primitives = "0.37"

# Environment and config
dotenvy = "0.15"
dirs = "5.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Error handling
anyhow = "1.0"
thiserror = "2.0"

# TEE support
dstack-sdk = "0.1"  # Phala dstack SDK for TDX attestation

# TEE authentication (challenge-response with register-contract)
shared-tee-helpers = { git = "https://github.com/out-layer/shared-tee-helpers", branch = "main" }
reqwest = { version = "0.11", features = ["json"] }
uuid = { version = "1.0", features = ["v4", "serde"] }

# TEE support (conditional compilation for future)
[target.'cfg(target_env = "sgx")'.dependencies]
# sgx_tstd = "2.0"  # Will be added when TEE integration is ready

[dev-dependencies]
# Must match the normal `reqwest` dependency above, otherwise the test build sees two
# candidate rlibs for the same extern name (E0464).
reqwest = { version = "0.11", features = ["json"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
