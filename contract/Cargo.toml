[package]
name = "outlayer-contract"
version = "0.1.0"
edition = "2021"
repository = "https://github.com/out-layer/outlayer"
license = "Apache-2.0"

# `cargo near build reproducible-wasm`: the release build, in this pinned image, from a clean
# committed tree. Anyone rebuilding the same commit gets the same wasm and the same sha256 —
# the code hash a DAO upgrade proposal names.
[package.metadata.near.reproducible_build]
image = "sourcescan/cargo-near:0.13.4-rust-1.85.0"
image_digest = "sha256:a9d8bee7b134856cc8baa142494a177f2ba9ecfededfcdd38f634e14cca8aae2"
passed_env = []
container_build_command = ["cargo", "near", "build", "non-reproducible-wasm", "--locked"]

[features]
# `migrate-probe`: a TEST build whose `migrate()` takes no arguments and reads the current
# layout as it is, for tests/dao/upgrade_e2e.sh to prove a governed upgrade with migrate.
# Never deployed outside a test set.
migrate-probe = []

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = { version = "5.9.0", features = ["legacy", "unit-testing", "unstable"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
base64 = "0.21.7"
sha2 = "0.10.8"
hex = "0.4"
bs58 = "0.5"

[dev-dependencies]
near-workspaces = "0.14.1"
tokio = { version = "1.40", features = ["full"] }
# Unit tests sign with a real wallet key: `store_agent_secret` accepts a secret
# only against an ed25519 signature, and a test that fabricated one would be
# testing nothing.
ed25519-dalek = "2.1"
rand = "0.8"

[profile.release]
codegen-units = 1
opt-level = "s"
lto = true
debug = false
panic = "abort"
overflow-checks = true
