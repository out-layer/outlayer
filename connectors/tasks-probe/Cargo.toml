[package]
name = "tasks-probe"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "A project that does nothing useful with tasks, so everything around a task can be tested"

[[bin]]
name = "tasks-probe"
path = "src/main.rs"

[dependencies]
# The SDK of this repository: `outlayer::tasks` and the dispatcher under test.
outlayer = { path = "../../sdk/outlayer", features = ["tasks"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
opt-level = "z"
lto = true
strip = true
codegen-units = 1

[workspace]
