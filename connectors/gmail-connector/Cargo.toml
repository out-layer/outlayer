[package]
name = "gmail-connector"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "OutLayer connector for Gmail: an agent sends mail from the owner's own address, under the owner's policy"

[[bin]]
name = "gmail-connector"
path = "src/main.rs"

[dependencies]
# Input, output and project storage (the token cache and the daily counter).
outlayer = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# The only way out of the enclave: the worker's allowlist decides whether a
# request leaves at all. There are no sockets, which is why this connector speaks
# Gmail's REST API and not IMAP or SMTP.
wasi-http-client = "0.2"
base64 = "0.21"
# The token cache is keyed by a digest of the credential it was minted from.
sha2 = "0.10"
# Sealing the policy to a key the caller supplied, for runs whose output lands
# on chain. The pair near.email runs on: `ecies` here, `eciesjs` in the browser.
ecies = { version = "0.2", default-features = false, features = ["pure", "std"] }
libsecp256k1 = "0.7"

[profile.release]
opt-level = "z"
lto = true
strip = true
codegen-units = 1
